services:
  # ============================================================================
  # 1. Microsoft SQL Server 2022 Database Engine (Hardened RAM Ceiling <= 1.28 GB)
  # ============================================================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pwd301_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-AdminStrongPassw0rd!}
      - MSSQL_PID=Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - backup_data:/var/opt/mssql/backups
      - ./deploy/mssql.conf:/var/opt/mssql/mssql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 1500m
    mem_reservation: 1000m
    cpus: 1.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pwd301_net
    restart: unless-stopped

  # ============================================================================
  # 2. ClamAV Malware Scanning Daemon (Hardened RAM Ceiling <= 800 MB)
  # ============================================================================
  clamav:
    image: clamav/clamav:latest
    container_name: pwd301_clamav
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_defs:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 5 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 800m
    mem_reservation: 500m
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pwd301_net
    restart: unless-stopped

  # ============================================================================
  # 3. PWD301 Flask LMS Web Engine (Gunicorn WSGI - 2 Workers, 4 Threads)
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pwd301_web
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "4", "--threads", "36", "--worker-class", "gthread", "--timeout", "120", "--max-requests", "50000", "--max-requests-jitter", "200", "--access-logfile", "/dev/null", "--error-logfile", "-", "wsgi:app"]
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-50}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-25}
      - PORT=${PORT:-5000}
      - USE_PROXY_FIX=${USE_PROXY_FIX:-true}
      - SECRET_KEY=${SECRET_KEY:-c84f88b4886f48f681aefd59d9c24097e3a985cfb8417c88}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-f71d530184ebc96328399581fa79e9515647000b217a9426f04ceb18dae172a3}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - REMEMBER_COOKIE_SECURE=${REMEMBER_COOKIE_SECURE:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@backend.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123456}
      - ADMIN_DISPLAY_NAME=${ADMIN_DISPLAY_NAME:-Administrator}
      - DATABASE_URL=mssql+pyodbc://${DB_USER:-sa}:${DB_PASSWORD:-AdminStrongPassw0rd!}@db:1433/${DB_NAME:-PWD301}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      - DB_HOST=db
      - DB_PORT=1433
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-AdminStrongPassw0rd!}
      - DB_NAME=${DB_NAME:-PWD301}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-flash-latest}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_HOST=${MAIL_HOST:-smtp.resend.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-resend}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-Hệ thống PPTQ <noreply@pptq.id.vn>}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-1}
      - FRONTEND_URL=${FRONTEND_URL:-https://pptq.id.vn}
      - PPTQ_PASSWORD_PEPPER=${PPTQ_PASSWORD_PEPPER:-PPTQ_LMS_PEPPER_2026_SECURE}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID:-4499c036-1c34-4f9f-8801-e5c436c89305}
      - PAYOS_API_KEY=${PAYOS_API_KEY:-c41ff8e9-676f-4383-858e-3dfc660a0cf0}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY:-70416e4bea731fa6887e4d175e4503aae1e49b938d0d9a9f6463b0e568ed6d4d}
      - PPTQ_BANK_NAME=${PPTQ_BANK_NAME:-MBBank (MBB - Ngân hàng TMCP Quân đội)}
      - PPTQ_BANK_BIN=${PPTQ_BANK_BIN:-970422}
      - PPTQ_ACCOUNT_NUMBER=${PPTQ_ACCOUNT_NUMBER:-0908667141}
      - PPTQ_ACCOUNT_NAME=${PPTQ_ACCOUNT_NAME:-PHAM NGUYEN HOANG PHUC}
      - HOST_TOTAL_RAM_GB=${HOST_TOTAL_RAM_GB:-31.7}
      - HOST_OS=${HOST_OS:-Windows 11}
      - HOST_NAME=${HOST_NAME:-DESKTOP-71A4210}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-LOCAL}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN:-}
      - FILE_STORAGE_ROOT=/app/storage
      - FILE_QUARANTINE_ROOT=/app/quarantine
      - FILE_BACKUP_ROOT=/app/backups
      - SQLSERVER_BACKUP_ROOT=/var/opt/mssql/backups
      - EXPORT_ROOT=/app/exports
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-8}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-20}
      - GUNICORN_WORKER_CLASS=${GUNICORN_WORKER_CLASS:-gthread}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
      - GUNICORN_MAX_REQUESTS=${GUNICORN_MAX_REQUESTS:-1000}
      - GUNICORN_MAX_REQUESTS_JITTER=${GUNICORN_MAX_REQUESTS_JITTER:-100}
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./migrations:/app/migrations
      - ./frontend:/app/frontend
      - storage_data:/app/storage
      - quarantine_data:/app/quarantine
      - backup_data:/app/backups
      - export_data:/app/exports
    mem_limit: 600m
    mem_reservation: 300m
    cpus: 1.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pwd301_net
    restart: unless-stopped

  # ============================================================================
  # 4. Durable Background Worker (Adaptive Polling, RAM Ceiling <= 300 MB)
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pwd301_worker
    command: ["python", "scripts/run_worker.py"]
    environment:
      - APP_ENV=${APP_ENV:-development}
      - FLASK_DEBUG=${FLASK_DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:-c84f88b4886f48f681aefd59d9c24097e3a985cfb8417c88}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-f71d530184ebc96328399581fa79e9515647000b217a9426f04ceb18dae172a3}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - REMEMBER_COOKIE_SECURE=${REMEMBER_COOKIE_SECURE:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@backend.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123456}
      - ADMIN_DISPLAY_NAME=${ADMIN_DISPLAY_NAME:-Administrator}
      - DATABASE_URL=mssql+pyodbc://${DB_USER:-sa}:${DB_PASSWORD:-AdminStrongPassw0rd!}@db:1433/${DB_NAME:-PWD301}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      - DB_HOST=db
      - DB_PORT=1433
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-AdminStrongPassw0rd!}
      - DB_NAME=${DB_NAME:-PWD301}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-1}
      - MAIL_FROM=${MAIL_FROM:-}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-LOCAL}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN:-}
      - FILE_STORAGE_ROOT=/app/storage
      - FILE_QUARANTINE_ROOT=/app/quarantine
      - FILE_BACKUP_ROOT=/app/backups
      - SQLSERVER_BACKUP_ROOT=/var/opt/mssql/backups
      - EXPORT_ROOT=/app/exports
      - WORKER_POLL_INTERVAL_SECONDS=${WORKER_POLL_INTERVAL_SECONDS:-2}
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
      web:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./migrations:/app/migrations
      - storage_data:/app/storage
      - quarantine_data:/app/quarantine
      - backup_data:/app/backups
      - export_data:/app/exports
    mem_limit: 300m
    mem_reservation: 150m
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pwd301_net
    restart: unless-stopped

volumes:
  sqldata:
    name: pwd301_sqldata
  clamav_defs:
    name: pwd301_clamav_defs
  storage_data:
    name: pwd301_storage_data
  quarantine_data:
    name: pwd301_quarantine_data
  backup_data:
    name: pwd301_backup_data
  export_data:
    name: pwd301_export_data

networks:
  pwd301_net:
    name: pwd301_network
    driver: bridge
