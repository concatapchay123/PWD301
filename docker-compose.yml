services:
  # ============================================================================
  # 1. Microsoft SQL Server 2022 Database Engine (Hardened RAM Ceiling <= 1.28 GB)
  # ============================================================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pwd301_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-AdminStrongPassw0rd!}
      - MSSQL_PID=Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - backup_data:/var/opt/mssql/backups
      - ./deploy/mssql.conf:/var/opt/mssql/mssql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 1500m
    mem_reservation: 1000m
    cpus: 1.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pwd301_net
    restart: unless-stopped

  # ============================================================================
  # 2. ClamAV Malware Scanning Daemon (Hardened RAM Ceiling <= 800 MB)
  # ============================================================================
  clamav:
    image: clamav/clamav:latest
    container_name: pwd301_clamav
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_defs:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 5 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 800m
    mem_reservation: 500m
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pwd301_net
    restart: unless-stopped

  # ============================================================================
  # 3. PWD301 Flask LMS Web Engine (Gunicorn WSGI - 2 Workers, 4 Threads)
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pwd301_web
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - PORT=${PORT:-5000}
      - USE_PROXY_FIX=${USE_PROXY_FIX:-true}
      - SECRET_KEY=${SECRET_KEY:-c84f88b4886f48f681aefd59d9c24097e3a985cfb8417c88}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-f71d530184ebc96328399581fa79e9515647000b217a9426f04ceb18dae172a3}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - DATABASE_URL=mssql+pyodbc://${DB_USER:-sa}:${DB_PASSWORD:-AdminStrongPassw0rd!}@db:1433/${DB_NAME:-PWD301}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      - DB_HOST=db
      - DB_PORT=1433
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-AdminStrongPassw0rd!}
      - DB_NAME=${DB_NAME:-PWD301}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-flash-latest}
      - HOST_TOTAL_RAM_GB=${HOST_TOTAL_RAM_GB:-31.7}
      - HOST_OS=${HOST_OS:-Windows 11}
      - HOST_NAME=${HOST_NAME:-DESKTOP-71A4210}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-LOCAL}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN:-}
      - FILE_STORAGE_ROOT=/app/storage
      - FILE_QUARANTINE_ROOT=/app/quarantine
      - FILE_BACKUP_ROOT=/app/backups
      - SQLSERVER_BACKUP_ROOT=/var/opt/mssql/backups
      - EXPORT_ROOT=/app/exports
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
      - GUNICORN_MAX_REQUESTS=${GUNICORN_MAX_REQUESTS:-1000}
      - GUNICORN_MAX_REQUESTS_JITTER=${GUNICORN_MAX_REQUESTS_JITTER:-100}
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./frontend:/app/frontend
      - storage_data:/app/storage
      - quarantine_data:/app/quarantine
      - backup_data:/app/backups
      - export_data:/app/exports
    mem_limit: 600m
    mem_reservation: 300m
    cpus: 1.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pwd301_net
    restart: unless-stopped

  # ============================================================================
  # 4. Durable Background Worker (Adaptive Polling, RAM Ceiling <= 300 MB)
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pwd301_worker
    command: ["python", "scripts/run_worker.py"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY:-c84f88b4886f48f681aefd59d9c24097e3a985cfb8417c88}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-f71d530184ebc96328399581fa79e9515647000b217a9426f04ceb18dae1723}
      - DATABASE_URL=mssql+pyodbc://${DB_USER:-sa}:${DB_PASSWORD:-AdminStrongPassw0rd!}@db:1433/${DB_NAME:-PWD301}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      - DB_HOST=db
      - DB_PORT=1433
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-AdminStrongPassw0rd!}
      - DB_NAME=${DB_NAME:-PWD301}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-1}
      - MAIL_FROM=${MAIL_FROM:-}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-LOCAL}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN:-}
      - FILE_STORAGE_ROOT=/app/storage
      - FILE_QUARANTINE_ROOT=/app/quarantine
      - FILE_BACKUP_ROOT=/app/backups
      - SQLSERVER_BACKUP_ROOT=/var/opt/mssql/backups
      - EXPORT_ROOT=/app/exports
      - WORKER_POLL_INTERVAL_SECONDS=${WORKER_POLL_INTERVAL_SECONDS:-2}
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - storage_data:/app/storage
      - quarantine_data:/app/quarantine
      - backup_data:/app/backups
      - export_data:/app/exports
    mem_limit: 300m
    mem_reservation: 150m
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pwd301_net
    restart: unless-stopped

volumes:
  sqldata:
    name: pwd301_sqldata
  clamav_defs:
    name: pwd301_clamav_defs
  storage_data:
    name: pwd301_storage_data
  quarantine_data:
    name: pwd301_quarantine_data
  backup_data:
    name: pwd301_backup_data
  export_data:
    name: pwd301_export_data

networks:
  pwd301_net:
    name: pwd301_network
    driver: bridge
