{% extends "base.html" %}

{% block title %}Quên mật khẩu — PWD301{% endblock %}
{% block meta_description %}Khôi phục mật khẩu tài khoản PWD301{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center py-5" style="min-height: 75vh;">
  <div class="card shadow-sm border border-slate-200" style="width: 100%; max-width: 440px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="topbar-brand-mark mx-auto mb-2" style="width: 40px; height: 40px; font-size: 18px;">P3</div>
        <h4 class="page-title mb-1">Quên mật khẩu</h4>
        <p class="text-caption text-muted m-0">Nhập địa chỉ email để nhận hướng dẫn đặt lại mật khẩu</p>
      </div>

      <form action="{{ url_for('auth.forgot_password') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group mb-3">
          <label class="form-label" for="email">Địa chỉ email</label>
          <input type="email" name="email" id="email" class="form-control form-control-sm" placeholder="nhap@email.com" required autofocus>
        </div>

        <button type="submit" class="btn btn-primary btn-sm w-100 py-2 fw-semibold">Gửi hướng dẫn</button>
      </form>

      <div class="text-center mt-4 pt-3 border-top border-slate-200">
        <a href="{{ url_for('auth.login') }}" class="text-caption text-muted">← Quay lại đăng nhập</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
