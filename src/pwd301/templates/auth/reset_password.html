{% extends "base.html" %}

{% block title %}Đặt lại mật khẩu — PWD301{% endblock %}
{% block meta_description %}Thiết lập mật khẩu mới cho tài khoản PWD301{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center py-5" style="min-height: 75vh;">
  <div class="card shadow-sm border border-slate-200" style="width: 100%; max-width: 440px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="topbar-brand-mark mx-auto mb-2" style="width: 40px; height: 40px; font-size: 18px;">P3</div>
        <h4 class="page-title mb-1">Đặt lại mật khẩu</h4>
        <p class="text-caption text-muted m-0">Vui lòng nhập mật khẩu mới của bạn</p>
      </div>

      <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group mb-3">
          <label class="form-label" for="password">Mật khẩu mới (tối thiểu 8 ký tự)</label>
          <input type="password" name="password" id="password" class="form-control form-control-sm" placeholder="••••••••" required minlength="8" autofocus>
        </div>

        <div class="form-group mb-3">
          <label class="form-label" for="confirm_password">Xác nhận mật khẩu mới</label>
          <input type="password" name="confirm_password" id="confirm_password" class="form-control form-control-sm" placeholder="••••••••" required minlength="8">
        </div>

        <button type="submit" class="btn btn-primary btn-sm w-100 py-2 fw-semibold">Xác nhận đặt lại mật khẩu</button>
      </form>

      <div class="text-center mt-4 pt-3 border-top border-slate-200">
        <a href="{{ url_for('auth.login') }}" class="text-caption text-muted">← Quay lại đăng nhập</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
